name: Build APK

# Builds on every push to main and on demand from the Actions tab.
# Each successful build replaces the APK on the "latest" release, which gives
# phones and TVs one fixed download URL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to update the "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper JAR, so Gradle itself is provisioned here.
      # The runner image already ships the Android SDK with licences accepted.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The signing key lives only in the EMBER_KEYSTORE_B64 secret. Every
      # published build must be signed with it, or it cannot install over the
      # previous one. Without it the build still compiles (so code errors show
      # up), but nothing is published and the run is marked failed at the end.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.EMBER_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::EMBER_KEYSTORE_B64 is not set; building, but not publishing."
            echo "HAS_KEY=false" >> "$GITHUB_ENV"
          else
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/ember-release.p12"
            echo "EMBER_KEYSTORE_PATH=$RUNNER_TEMP/ember-release.p12" >> "$GITHUB_ENV"
            echo "HAS_KEY=true" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Name the APK
        if: env.HAS_KEY == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk ember.apk

      - name: Upload build artifact
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ember-apk
          path: ember.apk
          retention-days: 30

      - name: Publish to the "latest" release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build ${{ github.run_number }} of ${{ github.sha }}.
            Download ember.apk below. It installs over any earlier Ember build.
          prerelease: true
          make_latest: true
          files: ember.apk

      # Runs after publishing, so a failing test flags a problem without
      # holding back an APK you might want to try anyway.
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/

      - name: Refuse to pass without the signing key
        if: env.HAS_KEY != 'true'
        run: |
          echo "::error::Compiled fine, but EMBER_KEYSTORE_B64 is missing, so nothing was published."
          exit 1
