name: Build APK

# Builds on every push to main and on demand from the Actions tab.
# Each successful build replaces the APK on the "latest" release, which gives
# the TV one fixed download URL to point the Downloader app at.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # needed to update the "latest" release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The repo has no Gradle wrapper JAR, so Gradle itself is provisioned here.
      # The runner image already ships the Android SDK with licences accepted.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk fincast-debug.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fincast-debug-apk
          path: fincast-debug.apk
          retention-days: 30

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: |
            Automatic build of ${{ github.sha }}.
            Install on a TV with the Downloader app using the APK link below.
          prerelease: true
          make_latest: true
          files: fincast-debug.apk

      # Runs after publishing, so a failing test flags a problem without
      # holding back an APK you might want to try anyway.
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
